schemaVersion: "2"
kind: sandbox
name: pi
version: "1.1.0"
displayName: Pi Coding Agent
description: Runs the pi coding agent from the pre-baked pi sandbox image.
sourceURL: https://pi.dev

sandbox:
  # shell-docker + fd-find + pi, rebuilt nightly against pi's latest release
  image: "docker.io/sbx/pi-image:latest"
  entrypoint:
    - "pi"

permissions:
  network:
    allow:
      - pi.dev
